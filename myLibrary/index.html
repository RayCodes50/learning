<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <h1>This's my library</h1>
      <div class="add_book">
        <p>Add book to the library</p>
        <button class="add">Add</button>
      </div>
      <div class="form visibility">
        <form action="" method="get">
          <div class="element">
            <p>Title</p>
            <input class="title" type="text" name="" id="" />
          </div>
          <div class="element">
            <p>Author</p>
            <input class="author" type="text" name="" id="" />
          </div>
          <div class="element">
            <p>Nr. of pages</p>
            <input class="pages" type="text" name="" id="" />
          </div>
          <div class="element">
            <p>Did you read id yet?</p>
            <input class="read" type="text" name="" id="" />
          </div>
          <button class="formBtn">Add book</button>
        </form>
      </div>
      <div class="container">
        <!-- <div class="card">Hello</div> -->
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
