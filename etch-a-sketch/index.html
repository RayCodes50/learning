<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Etch a sketch</title>
  </head>
  <body>
    <section>
      <h1>Sketchpad</h1>
      <div class="flex">
        <div class="wrapper">
          <menu>
            <div>
              <input type="text" class="gridSize" placeholder="Grid size" />
              <button class="resetBtn">Reset</button>
            </div>
            <button class="pickBtn">Pick Color</button>
            <button class="blackBtn">Black Color</button>
            <button class="whiteBtn">White Color</button>
            <button class="eraseBtn">Eraser</button>
            <button class="rainbowBtn">Rainbow Mode</button>
            <button class="opacityBtn">Opacity</button>
          </menu>
          <div class="sketch"></div>
        </div>
      </div>
    </section>
  </body>
  <script src="./script.js"></script>
</html>
