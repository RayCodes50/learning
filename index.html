    <script>
      const btn = document.getElementById("btn");
      const img = document.querySelector(".img");
      const secondImg = document.querySelector("#secondImg");
      const searchInput = document.getElementById("searchInput");
      async function getCats() {
        try {
          const response = await fetch(
            "https://api.giphy.com/v1/gifs/translate?api_key=yFnGpRq1605Yjk6bc0p2reH83akV7maP&s=cats",
          );
          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }
          const catData = await response.json();
          img.src = catData.data.images.original.url;
        } catch (error) {
          console.log(error);
        }
      }
      getCats();

      btn.addEventListener("click", () => {

      async function loadJson(url) {
        try {
          const urlBack = await fetch(url);
          if (urlBack.status !== 200) {
            throw new Error(`HTTP error: ${urlBack.status}`);
          }
          return urlBack.json();
        } catch (error) {
