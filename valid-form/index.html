<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Odin Form</title>
  </head>
  <body>
    <div class="wrapper">
      <section class="left">
        <div class="wrap">
          <img
            src="./odin-lined.png"
            alt="Odin Project logo, white outline of a viking mask"
          />
          <p>ODIN</p>
        </div>
      </section>
      <section class="right">
        <section>
          <h1 class="title">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <em>now</em> to get started
          </h1>
          <p>You know you want to.</p>
          <form action="" method="post">
            <h2>Let's do this!</h2>
            <p>
              <label for="first_name">FIRST NAME </label
              ><input type="text" name="first_name" id="first_name" />
            </p>
            <p>
              <label for="last_name">LAST NAME</label
              ><input type="text" name="last_name" id="last_name" />
            </p>
            <p>
              <label for="email">EMAIL</label>
              <input type="email" name="" id="email" />
            </p>
            <p>
              <label for="phone_number">PHONE NUMBER</label>
              <input type="text" name="phone_number" id="phone_number" />
            </p>
            <p>
              <label for="password"></label>PASSWORD
              <input type="password" name="password" id="password" />
            </p>
            <p>
              <label for="password_confirm"></label>CONFIRM PASSWORD<input
                type="password"
                name="password_confirm"
                id="password_confirm"
              />
            </p>
          </form>
        </section>
        <section class="footer">
          <button type="submit">Create Account</button>
          <p>Already have an Account?<span class="log">Log in</span></p>
        </section>
      </section>
    </div>
  </body>
</html>
